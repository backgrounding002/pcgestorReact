<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCGestor - Ubicaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
</head>
<body class="sb-nav-fixed">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="dashboard.html">PCGestor</a>
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="ms-auto">
                <span class="text-white me-3" id="userName">Usuario</span>
                <span class="badge bg-primary" id="userRol"></span>
                <button class="btn btn-outline-light btn-sm ms-3" id="btnLogout">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <div class="sb-sidenav-menu-heading">Módulos</div>
                        <a class="nav-link" href="dashboard.html">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                        <a class="nav-link" href="equipos.html">
                            <i class="fas fa-laptop"></i> Equipos
                        </a>
                        <a class="nav-link" href="asignaciones.html">
                            <i class="fas fa-exchange-alt"></i> Asignaciones
                        </a>
                        <a class="nav-link" href="mantenimientos.html">
                            <i class="fas fa-tools"></i> Mantenimientos
                        </a>
                        <a class="nav-link" href="usuarios.html">
                            <i class="fas fa-users"></i> Usuarios
                        </a>
                        <a class="nav-link active" href="ubicaciones.html">
                            <i class="fas fa-map-marker-alt"></i> Ubicaciones
                        </a>
                        <div class="sb-sidenav-menu-heading">Reportes</div>
                        <a class="nav-link" href="reportes.html">
                            <i class="fas fa-chart-bar"></i> Reportes
                        </a>
                    </div>
                </div>
                <div class="sb-sidenav-footer">
                    <small>PCGestor v1.0</small>
                </div>
            </nav>
        </div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                        <h1><i class="fas fa-map-marker-alt me-2"></i>Ubicaciones</h1>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalUbicacion">
                            <i class="fas fa-plus"></i> Agregar ubicación
                        </button>
                    </div>

                    <!-- Filtros de búsqueda -->
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Filtros de búsqueda</h6>
                        </div>
                        <div class="card-body">
                            <div class="row">
                                <div class="col-md-6 mb-3">
                                    <label class="form-label">Buscar</label>
                                    <input type="text" id="buscarUbicacion" class="form-control" placeholder="Edificio, piso o sala...">
                                </div>
                                <div class="col-md-4 mb-3">
                                    <label class="form-label">Filtrar por edificio</label>
                                    <select id="filtroEdificio" class="form-select">
                                        <option value="todos">Todos los edificios</option>
                                        <option value="A">Edificio A</option>
                                        <option value="B">Edificio B</option>
                                        <option value="C">Edificio C</option>
                                    </select>
                                </div>
                                <div class="col-md-2 mb-3 d-flex align-items-end">
                                    <button class="btn btn-secondary w-100" id="btnRecargar">
                                        <i class="fas fa-sync-alt"></i> Recargar
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>

                    <!-- Tabla de ubicaciones -->
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Listado de ubicaciones</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="tablaUbicaciones" width="100%">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Edificio</th>
                                            <th>Piso</th>
                                            <th>Sala</th>
                                            <th>Descripción</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal para crear/editar ubicación -->
    <div class="modal fade" id="modalUbicacion" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar ubicación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formUbicacion">
                        <input type="hidden" id="ubicacionId">
                        <div class="mb-3">
                            <label class="form-label">Edificio *</label>
                            <input type="text" class="form-control" id="edificio" required placeholder="Ej: Edificio A">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Piso *</label>
                            <input type="text" class="form-control" id="piso" required placeholder="Ej: 1, 2, 3 o Sótano">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Sala *</label>
                            <input type="text" class="form-control" id="sala" required placeholder="Ej: 101, Aula 1">
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Descripción</label>
                            <textarea class="form-control" id="descripcion" rows="2" placeholder="Detalles adicionales de la ubicación"></textarea>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarUbicacion()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
    <script src="js/ubicaciones.js"></script>
</body>
</html>
