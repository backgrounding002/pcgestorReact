<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCGestor - Asignaciones</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
</head>
<body class="sb-nav-fixed">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">PCGestor</a>
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="ms-auto">
                <span class="text-white me-3" id="userName">Usuario</span>
                <span class="badge bg-primary" id="userRol"></span>
                <button class="btn btn-outline-light btn-sm ms-3" id="btnLogout">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <div class="sb-sidenav-menu-heading">Módulos</div>
                        <a class="nav-link" href="index.html">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                        <a class="nav-link" href="equipos.html">
                            <i class="fas fa-laptop"></i> Equipos
                        </a>
                        <a class="nav-link active" href="asignaciones.html">
                            <i class="fas fa-exchange-alt"></i> Asignaciones
                        </a>
                        <a class="nav-link" href="mantenimientos.html">
                            <i class="fas fa-tools"></i> Mantenimientos
                        </a>
                        <!-- ID agregado para control de roles -->
                        <a class="nav-link" href="usuarios.html" id="menu-usuarios">
                            <i class="fas fa-users"></i> Usuarios
                        </a>
                        <a class="nav-link" href="ubicaciones.html">
                            <i class="fas fa-map-marker-alt"></i> Ubicaciones
                        </a>
                        <div class="sb-sidenav-menu-heading">Reportes</div>
                        <!-- ID agregado para control de roles -->
                        <a class="nav-link" href="reportes.html" id="menu-reportes">
                            <i class="fas fa-chart-bar"></i> Reportes
                        </a>
                    </div>
                </div>
                <div class="sb-sidenav-footer">
                    <small>PCGestor v1.0</small>
                </div>
            </nav>
        </div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                        <h1>Asignaciones de equipos</h1>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalAsignacion">
                            <i class="fas fa-plus"></i> Agregar asignación
                        </button>
                    </div>
                    
                    <div class="card shadow mb-4">
                        <div class="card-header py-3">
                            <h6 class="m-0 font-weight-bold text-primary">Listado de asignaciones</h6>
                        </div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="tablaAsignaciones" width="100%" cellspacing="0">
                                    <thead>
                                        <tr>
                                            <th>ID</th>
                                            <th>Fecha</th>
                                            <th>Equipo</th>
                                            <th>Empleado</th>
                                            <th>Motivo</th>
                                            <th>Estado</th>
                                            <th>Acciones</th>
                                        </tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal para crear/editar asignación -->
    <div class="modal fade" id="modalAsignacion" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Nueva asignación</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formAsignacion">
                        <input type="hidden" id="asignacionId">
                        <div class="mb-3">
                            <label class="form-label">Fecha</label>
                            <input type="date" class="form-control" id="fechaAsignacion" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Equipo</label>
                            <select class="form-control" id="equipoId" required>
                                <option value="">Seleccionar equipo</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Empleado</label>
                            <select class="form-control" id="usuarioId" required>
                                <option value="">Seleccionar empleado</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">Motivo</label>
                            <textarea class="form-control" id="motivo" rows="2"></textarea>
                        </div>
                        <div class="mb-3 form-check">
                            <input type="checkbox" class="form-check-input" id="activa" checked>
                            <label class="form-check-label" for="activa">Activa</label>
                        </div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarAsignacion()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
    <script src="js/asignaciones.js"></script>
</body>
</html>
