<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCGestor - Dashboard</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
</head>
<body class="sb-nav-fixed">
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand" href="index.html">PCGestor</a>
            <button class="btn btn-link btn-sm order-1 order-lg-0 me-4 me-lg-0" id="sidebarToggle">
                <i class="fas fa-bars"></i>
            </button>
            <div class="ms-auto">
                <span class="text-white me-3" id="userName">Usuario</span>
                <span class="badge bg-primary" id="userRol"></span>
                <button class="btn btn-outline-light btn-sm ms-3" id="btnLogout">
                    <i class="fas fa-sign-out-alt"></i> Salir
                </button>
            </div>
        </div>
    </nav>

    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">
            <nav class="sb-sidenav accordion sb-sidenav-dark">
                <div class="sb-sidenav-menu">
                    <div class="nav">
                        <div class="sb-sidenav-menu-heading">Módulos</div>
                        <a class="nav-link active" href="dashboard.html">
                            <i class="fas fa-tachometer-alt"></i> Dashboard
                        </a>
                        <a class="nav-link" href="equipos.html">
                            <i class="fas fa-laptop"></i> Equipos
                        </a>
                        <a class="nav-link" href="asignaciones.html">
                            <i class="fas fa-exchange-alt"></i> Asignaciones
                        </a>
                        <a class="nav-link" href="mantenimientos.html">
                            <i class="fas fa-tools"></i> Mantenimientos
                        </a>
                        <!-- ID agregado para control de roles -->
                        <a class="nav-link" href="usuarios.html" id="menu-usuarios">
                            <i class="fas fa-users"></i> Usuarios
                        </a>
                        <a class="nav-link" href="ubicaciones.html">
                            <i class="fas fa-map-marker-alt"></i> Ubicaciones
                        </a>
                        <div class="sb-sidenav-menu-heading">Reportes</div>
                        <!-- ID agregado para control de roles -->
                        <a class="nav-link" href="reportes.html" id="menu-reportes">
                            <i class="fas fa-chart-bar"></i> Reportes
                        </a>
                    </div>
                </div>
                <div class="sb-sidenav-footer">
                    <small>PCGestor v1.0</small>
                </div>
            </nav>
        </div>

        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <h1 class="mt-4">Dashboard</h1>
                    <div class="row">
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card card-stats bg-primary text-white shadow">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <div class="text-uppercase small">Equipos activos</div>
                                            <h1 class="mb-0" id="totalEquipos">0</h1>
                                        </div>
                                        <div class="col-auto">
                                            <i class="fas fa-laptop fa-2x"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card card-stats bg-success text-white shadow">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <div class="text-uppercase small">Equipos disponibles</div>
                                            <h1 class="mb-0" id="equiposDisponibles">0</h1>
                                        </div>
                                        <div class="col-auto">
                                            <i class="fas fa-check-circle fa-2x"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card card-stats bg-warning text-white shadow">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <div class="text-uppercase small">Mantenimientos pendientes</div>
                                            <h1 class="mb-0" id="mantenimientosPendientes">0</h1>
                                        </div>
                                        <div class="col-auto">
                                            <i class="fas fa-tools fa-2x"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-3 col-md-6 mb-4">
                            <div class="card card-stats bg-danger text-white shadow">
                                <div class="card-body">
                                    <div class="row">
                                        <div class="col">
                                            <div class="text-uppercase small">Asignaciones activas</div>
                                            <h1 class="mb-0" id="totalAsignaciones">0</h1>
                                        </div>
                                        <div class="col-auto">
                                            <i class="fas fa-exchange-alt fa-2x"></i>
                                        </div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>

                    <div class="row mt-4">
                        <div class="col-xl-6">
                            <div class="card shadow">
                                <div class="card-header">Equipos por estado</div>
                                <div class="card-body">
                                    <canvas id="chartEstadoEquipos" width="100%" height="300"></canvas>
                                </div>
                            </div>
                        </div>
                        <div class="col-xl-6">
                            <div class="card shadow">
                                <div class="card-header">Asignaciones recientes</div>
                                <div class="card-body">
                                    <div class="table-responsive">
                                        <table class="table table-sm" id="tablaAsignacionesRecientes">
                                            <thead>
                                                <tr>
                                                    <th>Fecha</th>
                                                    <th>Equipo</th>
                                                    <th>Usuario</th>
                                                </tr>
                                            </thead>
                                            <tbody></tbody>
                                        </table>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
    <script src="js/dashboard.js"></script>
</body>
</html>
