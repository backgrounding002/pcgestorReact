<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PCGestor - Equipos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://use.fontawesome.com/releases/v6.3.0/css/all.css" rel="stylesheet">
    <link href="https://cdn.datatables.net/1.13.4/css/dataTables.bootstrap5.min.css" rel="stylesheet">
    <link href="css/styles.css" rel="stylesheet">
    <link href="css/components.css" rel="stylesheet">
    <link href="css/responsive.css" rel="stylesheet">
</head>
<body class="sb-nav-fixed">
    <!-- Navbar y sidebar igual que en index.html (copiar la misma estructura) -->
    <nav class="sb-topnav navbar navbar-expand navbar-dark bg-dark fixed-top">...</nav>
    <div id="layoutSidenav">
        <div id="layoutSidenav_nav">...</div>
        <div id="layoutSidenav_content">
            <main>
                <div class="container-fluid px-4">
                    <div class="d-flex justify-content-between align-items-center mt-4 mb-4">
                        <h1>Gestión de Equipos</h1>
                        <button class="btn btn-primary" data-bs-toggle="modal" data-bs-target="#modalEquipo">
                            <i class="fas fa-plus"></i> Agregar Equipo
                        </button>
                    </div>
                    <div class="card shadow">
                        <div class="card-header">Listado de equipos</div>
                        <div class="card-body">
                            <div class="table-responsive">
                                <table class="table table-bordered" id="tablaEquipos" width="100%">
                                    <thead>
                                        <tr><th>ID</th><th>Marca</th><th>Modelo</th><th>Serial</th><th>Estado</th><th>Ubicación</th><th>Acciones</th></tr>
                                    </thead>
                                    <tbody></tbody>
                                </table>
                            </div>
                        </div>
                    </div>
                </div>
            </main>
        </div>
    </div>

    <!-- Modal Equipo -->
    <div class="modal fade" id="modalEquipo" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Registrar equipo</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="formEquipo">
                        <input type="hidden" id="equipoId">
                        <div class="mb-3"><label>Marca</label><input type="text" class="form-control" id="marca" required></div>
                        <div class="mb-3"><label>Modelo</label><input type="text" class="form-control" id="modelo" required></div>
                        <div class="mb-3"><label>Serial</label><input type="text" class="form-control" id="serial" required></div>
                        <div class="mb-3"><label>Estado</label>
                            <select class="form-control" id="estado">
                                <option>Activo</option><option>En mantenimiento</option><option>Dado de baja</option>
                            </select>
                        </div>
                        <div class="mb-3"><label>Ubicación</label><input type="text" class="form-control" id="ubicacion"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="button" class="btn btn-primary" onclick="guardarEquipo()">Guardar</button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.datatables.net/1.13.4/js/jquery.dataTables.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="js/main.js"></script>
    <script src="js/equipos.js"></script>
</body>
</html>
